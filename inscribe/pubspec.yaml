name: inscribe
description: "Celebrate friendships with personalized notes on likes, birthdays, and gift ideas."

version: 1.2.1+9

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  firebase_core: ^4.3.0
  firebase_analytics: ^12.1.0
  firebase_performance: ^0.11.1+3
  firebase_remote_config: ^6.1.3
  slang: ^4.11.1
  go_router: ^17.0.1
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1
  slang_flutter: ^4.11.0
  get_it: ^9.2.0
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.2.2
  smooth_page_indicator: ^2.0.1
  firebase_crashlytics: ^5.0.6
  google_fonts: ^6.2.1
  intl: ^0.20.0
  hive: ^2.2.3
  hive_flutter:
  freezed: ^3.2.4
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  uuid: ^4.4.0
  flutter_launcher_icons: ^0.14.4
  package_info_plus: ^9.0.0
  image_picker: ^1.1.2
  awesome_notifications_core: ^0.10.1
  awesome_notifications: ^0.10.1
  calendar_view: ^1.2.0
  file_saver: ^0.3.1
  file_picker: ^10.3.8
  flutter_staggered_grid_view: ^0.7.0
  slang_gpt: ^0.11.1
  colorist: ^0.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints:
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  colorist_builder: ^0.0.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/profile_images/
    - assets/images/wave_dividers/light/
    - assets/images/wave_dividers/dark/
    - assets/images/welcome_illustrations/light/
    - assets/images/welcome_illustrations/dark/
    - assets/fonts/montserrat/

  fonts:
    - family: Brogi
      fonts:
        - asset: assets/fonts/brogi_regular.otf
